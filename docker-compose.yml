services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: riistareitit
      POSTGRES_PASSWORD: riistareitit
      POSTGRES_DB: riistareitit
    ports:
      # Host port 5433, not 5432: some dev machines already run a native
      # Postgres on 5432 (see server/.env.example). Container-internal port
      # stays 5432 — only the host-side mapping changes.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
