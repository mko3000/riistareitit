# RII-36: lint, build and test the frontend and the server on every pull
# request (each push to it) and every push to main. See docs/SPEC.md §3
# "Testing". Merging into main should require both jobs to pass — that's a
# branch-protection setting in GitHub, not in this file.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20 # matches dev machines (Prisma 6 / jsdom 26 pins)
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  server:
    name: Server (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # Throwaway Postgres for the route tests — same image and credentials
      # as docker-compose.yml, database named *_test as the tests require.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riistareitit
          POSTGRES_PASSWORD: riistareitit
          POSTGRES_DB: riistareitit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U riistareitit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://riistareitit:riistareitit@localhost:5433/riistareitit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
